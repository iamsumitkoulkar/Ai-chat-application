name: AI Chat Application CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check server.js
      - name: Build backend Docker image
        run: docker build -t ai-chat-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t ai-chat-frontend ./frontend