services:
  backend:
    build: ./backend
    container_name: ai-chat-backend-container
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
     - ${USERPROFILE}/.aws:/root/.aws:ro

  frontend:
    build: ./frontend
    container_name: ai-chat-frontend-container
    ports:
      - "8080:80"
    depends_on:
      - backend